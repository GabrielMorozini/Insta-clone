services:

  # Laravel API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: instagram-api
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    networks:
      - instagram-network


  # Vue Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: instagram-front
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - instagram-network


  # Banco MySQL
  mysql:
    image: mysql:8.0
    container_name: instagram-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: instagram
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - instagram-network


  # Redis
  redis:
    image: redis:alpine
    container_name: instagram-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - instagram-network


  # Interface do banco
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: instagram-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - instagram-network


volumes:
  mysql-data:


networks:
  instagram-network:
    driver: bridge