[PHP]
; ------------------------------------------------------------------
; 1. SEGURANÇA E EXIBIÇÃO DE ERROS
; ------------------------------------------------------------------
; Desativa a exibição pública de erros (evita expor caminhos e senhas)
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Esconde a versão do PHP nos cabeçalhos HTTP (X-Powered-By)
expose_php = Off

; Registra todos os erros em log do sistema/Docker
log_errors = On
error_log = /dev/stderr

; ------------------------------------------------------------------
; 2. LIMITES DE RECURSOS E PERFORMANCE
; ------------------------------------------------------------------
; Limite seguro de memória para a maioria dos frameworks (Laravel, Symfony, etc.)
memory_limit = 256M

; Tempo máximo de execução de scripts (segundos)
max_execution_time = 60

; Limite de variáveis de entrada (previne ataques de DDoS/Hash collision)
max_input_vars = 3000

; ------------------------------------------------------------------
; 3. UPLOAD DE ARQUIVOS
; ------------------------------------------------------------------
file_uploads = On
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

; ------------------------------------------------------------------
; 4. DATA E FUSO HORÁRIO
; ------------------------------------------------------------------
[Date]
date.timezone = "America/Sao_Paulo"

; ------------------------------------------------------------------
; 5. OPCACHE (PERFORMANCE DE PRODUÇÃO)
; ------------------------------------------------------------------
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000

; Em produção, desativar o re-validação de timestamps acelera a execução
opcache.validate_timestamps = 0